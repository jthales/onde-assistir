<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark green rounded background -->
  <rect width="32" height="32" rx="7" fill="#14532d"/>
  <!-- White football -->
  <circle cx="16" cy="16" r="10" fill="white"/>
  <!-- Classic soccer ball: center pentagon -->
  <polygon points="16,9.5 20,12.5 18.5,17 13.5,17 12,12.5" fill="#14532d"/>
  <!-- 5 radiating seam lines from each pentagon vertex to ball edge -->
  <line x1="16"   y1="9.5"  x2="16"   y2="6"    stroke="#14532d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20"   y1="12.5" x2="23.5" y2="10.5"  stroke="#14532d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18.5" y1="17"   x2="22"   y2="21"    stroke="#14532d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13.5" y1="17"   x2="10"   y2="21"    stroke="#14532d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12"   y1="12.5" x2="8.5"  y2="10.5"  stroke="#14532d" stroke-width="1.5" stroke-linecap="round"/>
</svg>
