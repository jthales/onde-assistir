<div class="times-picker">
  <button class="time-chip time-chip--todos" [class.ativo]="timeSelecionado() === ''" (click)="timeSelected.emit('')">
    Todos os times
  </button>
  <div class="times-grid">
    @for (time of times(); track time.nome) {
      <button class="time-chip"
              [class.ativo]="timeSelecionado() === time.nome"
              [class.sem-jogo]="!timesComJogo().has(time.nome)"
              [class.notif-ativa]="timesComNotificacao().includes(time.nome)"
              (click)="timeSelected.emit(time.nome)"
              [title]="time.nome">
        @if (time.logo) {
          <img [src]="time.logo" [alt]="time.nome" class="chip-logo" (error)="$any($event.target).style.display='none'">
        }
        <span class="chip-initials">{{ getInitials(time.nome) }}</span>
      </button>
    }
  </div>
</div>
