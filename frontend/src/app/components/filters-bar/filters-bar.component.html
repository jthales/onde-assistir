<div class="filtros-bar">
  @if (temJogoAoVivo() || filtroAoVivo()) {
    <button class="filtro-vivo-btn" [class.ativo]="filtroAoVivo()" (click)="aoVivoClick.emit()">
      <span class="ao-vivo-dot" [class.ao-vivo-dot--pulsando]="temJogoAoVivo()"></span>
      Ao Vivo
    </button>
  }
  <button class="notif-btn"
          [class.ativo]="notifAtivaParaTimeAtual()"
          [class.notif-btn--disabled]="!timeSelecionado()"
          (click)="notifClick.emit()"
          [title]="tituloBotaoNotificacao()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    {{ textoBotaoNotificacao() }}
  </button>
</div>
