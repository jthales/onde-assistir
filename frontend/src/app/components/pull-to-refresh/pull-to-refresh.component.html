<div class="pull-indicator"
     [class.pull-indicator--ready]="pullDistance() >= 72"
     [class.pull-indicator--refreshing]="isRefreshing()"
     [style.transform]="'translateX(-50%) translateY(' + (isRefreshing() ? 64 : pullDistance()) + 'px)'"
     [style.opacity]="isRefreshing() ? 1 : pullDistance() / 72">
  <div class="pull-spinner" [class.pull-spinner--spin]="isRefreshing()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg>
  </div>
</div>
