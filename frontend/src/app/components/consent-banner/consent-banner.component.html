<div class="consent-banner" role="dialog" aria-label="Aviso de cookies">
  <div class="consent-content">
    <p class="consent-text">
      Usamos cookies de analytics para entender como o site é usado e melhorá-lo. Nenhum dado pessoal é vendido.
    </p>
    <div class="consent-actions">
      <button class="consent-btn consent-btn--decline" (click)="recusar.emit()">Recusar</button>
      <button class="consent-btn consent-btn--accept" (click)="aceitar.emit()">Aceitar</button>
    </div>
  </div>
</div>
