name: 🎬 Scrape CazéTV Melhores Momentos Copa 2026

on:
  schedule:
    # 3x ao dia: 08, 14, 20 UTC (05h, 11h, 17h BRT)
    - cron: '0 8,14,20 * * *'
  workflow_dispatch:

jobs:
  scrape-highlights:
    runs-on: ubuntu-latest

    steps:
      - name: 📅 Verificar período da Copa
        id: periodo
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" < "2026-06-11" || "$TODAY" > "2026-07-20" ]]; then
            echo "Fora do período da Copa ($TODAY). Encerrando."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Dentro do período da Copa ($TODAY). Executando."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 📥 Baixando o código
        if: steps.periodo.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: 🟢 Configurando Node.js v20
        if: steps.periodo.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalando dependências
        if: steps.periodo.outputs.skip == 'false'
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: 🎬 Scraping melhores momentos CazéTV
        if: steps.periodo.outputs.skip == 'false'
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          echo "Iniciando scraper CazéTV highlights — $(date '+%d/%m/%Y %H:%M:%S UTC')"
          npm run scrape:caze-highlights 2>&1 | tee ../caze-highlights.log
          exit ${PIPESTATUS[0]}

      - name: 📄 Salvar log como artifact
        if: steps.periodo.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: caze-highlights-log-${{ github.run_number }}
          path: caze-highlights.log
          retention-days: 7

      - name: 📋 Step Summary
        if: always()
        run: |
          echo "## CazéTV Highlights Scraper — $(date '+%d/%m/%Y %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f caze-highlights.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(✅|⚠️|❌|Resumo|Highlight|atualizados|sem match)" caze-highlights.log || echo "(sem linhas de resumo)"
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Execução ignorada (fora do período da Copa)." >> $GITHUB_STEP_SUMMARY
          fi
