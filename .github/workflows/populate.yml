name: 🎯 Populate Jogos Diário

on:
  schedule:
    - cron: '0 5,8,13,16,21 * * *' # Roda 5x ao dia: 05, 08, 13, 16, 21 UTC (02, 05, 10, 13, 18 BRT)
  workflow_dispatch:     # Permite rodar manualmente pelo GitHub

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixando o código
        uses: actions/checkout@v4

      - name: 🟢 Configurando Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalando dependências
        working-directory: backend
        run: |
          echo "Instalando dependências do backend..."
          npm ci
          echo "Dependências instaladas com sucesso."

      - name: 🚀 Executando populate
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          echo "Iniciando populate de jogos — $(date '+%d/%m/%Y %H:%M:%S UTC')"
          npm run populate 2>&1 | tee ../populate.log
          exit ${PIPESTATUS[0]}

      - name: 🔄 Invalidar cache do servidor após populate
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -n "$BACKEND_URL" ] && [ -n "$ADMIN_SECRET" ]; then
            curl -s -X POST "$BACKEND_URL/api/admin/invalidar-cache" \
              -H "x-admin-secret: $ADMIN_SECRET" \
              -H "Content-Type: application/json" || echo "Cache bust falhou (servidor pode estar offline)"
          else
            echo "BACKEND_URL ou ADMIN_SECRET não configurados — pulando cache bust"
          fi

      - name: 📄 Salvar log completo como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: populate-log-${{ github.run_number }}
          path: populate.log
          retention-days: 14

      - name: 📋 Step Summary
        if: always()
        run: |
          echo "## Populate — $(date '+%d/%m/%Y %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(──|Total:|Fontes:|✅|⚠️|❌|Erro)" populate.log || echo "(sem linhas de resumo)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
